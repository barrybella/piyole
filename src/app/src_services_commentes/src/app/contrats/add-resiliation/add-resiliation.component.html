<div class="card">
    <div class="card-status bg-primary br-tr-7 br-tl-7"></div>
  <div class="card-header text-withe">
      <div class="card-title">
         <span>Resiliation du contrat</span>
      </div> 
      <div class="card-options">
        <button type="button" (click)="dialogRef.close()" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">×</span>
        </button>
    </div>
  </div>
  <div class="card-body">
      <form id="quickForm" (ngSubmit)="onSubmit()" [formGroup]="controlForm"> 
          <div class="form-row">
              <div class="form-group col-md-12">
                  <label class="form-label text-dark">Motif</label>
                  <textarea formControlName="motif" class="form-control" id="" placeholder="Le motif du resiliation du contrat" rows="5"></textarea>
                  <!-- <span *ngIf="getTitleError()" class="text text-danger"><small>{{ getTitleError() }}</small></span> -->
              </div>
          </div>
          <div class="form-group">
              <label for="desc">Mot de passe</label>
              <input type="password" class="form-control" placeholder="******" formControlName="password" >
        <small id="emailHelp" class="form-text  text-danger" *ngIf="passwordIncorect">Mot de passe incorect</small>
              <!-- <span *ngIf="getDescError()" class="text text-danger"><small>{{ getDescError() }}</small></span> -->
          </div>
          <button type="submit" [disabled]="controlForm.invalid || etatPadding" class="btn btn-danger"><span class="spinner-border text-withe spinner-border-sm" *ngIf="etatPadding"></span> <span *ngIf="!etatPadding">Valider</span></button>
          </form>
  </div>
</div>
