<div class="card">
    <div class="card-status bg-primary br-tr-7 br-tl-7"></div>
    <div class="card-header">
        <div class="card-title">Connexion</div>
        <div class="card-options">
            <button type="button" (click)="dialogRef.close()" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">×</span>
            </button>
        </div>
    </div>
    <div class="card-body p-6">
        <div class="panel panel-primary">
            <!-- <div class="tab-menu-heading"> -->
                <div class="tabs-menu mb-4 " >
                    <!-- Tabs -->
                    <ul class="nav panel-tabs">
                        <li class=""><a href="#tab1" class="active mr-5" data-toggle="tab">Connexion</a></li>
                        <li><a href="#tab2" data-toggle="tab">Creer un compte</a></li>
                       
                    </ul>
                </div>
            <!-- </div> -->
            <div class="panel-body tabs-menu-body">
                <div class="tab-content">
                    <div class="tab-pane active " id="tab1">
                        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                            <div class="form-group">
                                <label class="form-label">Telephone ou Email</label>
                                <input type="text" formControlName="login" class="form-control" id="exampleInputEmail11"  placeholder="Entrer votre Numero de telelphone ou email.">
                                <!-- <span *ngIf="getTelError()" class="text text-danger"><small>{{ getTelError() }}</small></span> -->
                            </div>
                            <div class="form-group">
                               <label for="password">Mot de passe</label>
                               <input type="password" class="form-control" formControlName="password">
                            </div>
                            <span *ngIf="passwordIncorect"><span class="text-danger">Identifiant incorrecte!!</span></span><br>

                            <div class="form-footer">
                                <button type="submit" [disabled]="loginForm.invalid || etatPadding" class="btn btn-primary btn-block {{ etatPadding ? 'btn-loading' : '' }} mr-1">Connexion</button>
                            </div>
                        </form>
                    </div>
                    <div class="tab-pane  " id="tab2">
                        <app-register-shop [shop]="shop"></app-register-shop>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
